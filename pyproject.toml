[project]
name = "comanda"
version = "0.1.0"
description = "Web app di gestione semplificata per un piccolo ristorante."
readme = "README.md"
authors = [
    { name = "Davide Marcucci", email = "davide.marcucci@pm.me" }
]
requires-python = ">=3.14.5"
dependencies = []

[project.scripts]
comanda = "comanda:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F",   # errori base (pycodestyle, pyflakes)
    "I",        # ordinamento import
    "UP",       # sintassi moderna
    "B",        # bug comuni (bugbear)
    "SIM",      # semplificazioni
    "RUF",      # regole ruff
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
